<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Scrap Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0b100d;--pan:#131a15;--line:#24302a;--tx:#dfe9e1;--mut:#8a9a8e;--go:#4ade80;--warn:#fbbf24;--hot:#fb7185;--me:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
h1{font:700 15px ui-monospace,monospace;letter-spacing:.15em;margin:0;color:var(--go)}
#stat{font-size:12px;color:var(--mut);text-align:right}
#map{height:44vh;min-height:250px;background:#0e1511}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--pan);border-bottom:1px solid var(--line)}
.bar.top{position:sticky;top:0;z-index:500}
button,select{background:#1b251f;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-height:40px}
button.on,button.go{background:var(--go);color:#04130a;border-color:var(--go);font-weight:600}
#run{display:none;padding:10px;background:#101c14;border-bottom:1px solid var(--go)}
#run h2{font-size:14px;margin:0 0 6px;color:var(--go)}#run ol{margin:6px 0;padding-left:22px}#run li{margin:3px 0;font-size:13.5px}
#run .sum{font-size:13px;color:var(--mut);margin:4px 0}
#list{padding:8px 10px 60px;display:grid;gap:8px;max-width:760px;margin:auto}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:4px solid var(--line)}
.card.s5{border-left-color:var(--hot)}.card.s4{border-left-color:var(--warn)}.card.s3{border-left-color:var(--go)}
.card.new{box-shadow:0 0 0 1px var(--go) inset}.card.in{background:#12241a}
.t{font-weight:600}.m{font-size:12.5px;color:var(--mut);margin:3px 0}.n{font-size:13px;margin:5px 0;color:#c9d6cc}
.d{float:right;font:700 14px ui-monospace,monospace;color:var(--go);margin-left:8px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.acts a,.acts button{flex:1;text-align:center;text-decoration:none;color:var(--tx);background:#1b251f;border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;min-height:38px}
.acts button.add{background:var(--go);color:#04130a;font-weight:600;border-color:var(--go)}
.tag{display:inline-block;font:600 10.5px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;background:#1f2b24;color:var(--mut);margin-right:5px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.me{width:16px;height:16px;border-radius:50%;background:var(--me);border:3px solid #fff;animation:p 2s infinite}
.num{background:var(--go);color:#04130a;font:700 12px ui-monospace,monospace;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:2px solid #04130a}
@keyframes p{0%{box-shadow:0 0 0 0 #38bdf8aa}100%{box-shadow:0 0 0 18px #38bdf800}}
@media (prefers-reduced-motion:reduce){.me{animation:none}}
.leaflet-container{background:#0e1511}.leaflet-tile{filter:brightness(.72) contrast(1.1) saturate(.6)}
</style></head><body>
<header><h1>SCRAP RADAR</h1><div id="stat">starting…</div></header>
<div id="map"></div>
<div class="bar top">
  <select id="rad" aria-label="Range"><option value="2">2 mi</option><option value="5">5 mi</option><option value="10" selected>10 mi</option><option value="25">25 mi</option><option value="999">Any distance</option></select>
  <select id="min" aria-label="Minimum value"><option value="5">Top value only</option><option value="4" selected>Good and up</option><option value="3">Include materials</option><option value="1">Everything</option></select>
  <select id="src" aria-label="Source"><option value="">All sources</option><option value="cl">Craigslist</option><option value="ou">OfferUp</option><option value="tn">Trash Nothing</option></select>
  <button id="voice">Voice alerts off</button><button id="recenter">Center on me</button>
</div>
<div id="run">
  <h2>My pickup run</h2>
  <div class="bar" style="padding:0;background:none;border:0">
    <select id="end" aria-label="Where the run ends"><option value="last">End at last stop</option><option value="start">Return to where I am</option><option value="home">End at home</option></select>
    <button id="sethome">Set home = here</button><button id="clear">Clear run</button>
  </div>
  <ol id="stops"></ol><div class="sum" id="sum"></div>
  <div class="acts"><a class="go" id="gmaps" target="_blank" rel="noopener" style="background:var(--go);color:#04130a;font-weight:600">Drive this route in Google Maps</a></div>
</div>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id), R=3958.8, rad=x=>x*Math.PI/180;
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const SRC={cl:'Craigslist',ou:'OfferUp',tn:'Trash Nothing',fb:'Facebook',nd:'Nextdoor'};
let items=[],me=null,meManual=false,voice=false,scanned=null,statusOk=true,follow=true;
let hidden=new Set(LS('sr_hidden')||[]),run=LS('sr_run')||[],seen=new Set(LS('sr_seen')||[]),announced=new Set(),home=LS('sr_home');
const firstRun=!LS('sr_seen');
function dist(a,b,c,d){const x=rad(d-b)*Math.cos(rad((a+c)/2)),y=rad(c-a);return Math.sqrt(x*x+y*y)*R}
function bearing(a,b,c,d){const y=Math.sin(rad(d-b))*Math.cos(rad(c)),x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((Math.atan2(y,x)*180/Math.PI)+360)%360/45)%8]}
const map=L.map('map',{zoomControl:false}).setView([27.95,-82.3],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const pins=L.layerGroup().addTo(map),runLayer=L.layerGroup().addTo(map);let meMark=null,ring=null;
map.on('dragstart',()=>follow=false);
const color=s=>s>=5?'#fb7185':s>=4?'#fbbf24':s>=3?'#4ade80':'#6b7a70';
function age(iso){if(!iso)return'';const h=(Date.now()-new Date(iso))/36e5;return h<1?Math.max(1,Math.round(h*60))+' min ago':h<48?Math.round(h)+' h ago':Math.round(h/24)+' d ago'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---- route planning: shortest order through the chosen stops (nearest-neighbour start, then 2-opt improvement)
function plan(start,stops,end){
  if(!stops.length)return{order:[],miles:0};
  const P=[start,...stops],n=P.length,D=(i,j)=>dist(P[i].la,P[i].lo,P[j].la,P[j].lo);
  let ord=[0],left=new Set([...Array(n).keys()].slice(1));
  while(left.size){const c=ord[ord.length-1];let b=null;left.forEach(j=>{if(b===null||D(c,j)<D(c,b))b=j});ord.push(b);left.delete(b)}
  const tail=o=>end?dist(P[o[o.length-1]].la,P[o[o.length-1]].lo,end.la,end.lo):0;
  const len=o=>{let t=0;for(let i=0;i<o.length-1;i++)t+=D(o[i],o[i+1]);return t+tail(o)};
  let best=len(ord),improved=true;
  while(improved){improved=false;for(let i=1;i<n-1;i++)for(let k=i+1;k<n;k++){const c=ord.slice(0,i).concat(ord.slice(i,k+1).reverse(),ord.slice(k+1)),l=len(c);if(l<best-1e-9){ord=c;best=l;improved=true}}}
  return{order:ord.slice(1).map(i=>stops[i-1]),miles:best};
}
function renderRun(){
  runLayer.clearLayers();const stops=run.map(id=>items.find(i=>i.id===id)).filter(Boolean);
  $('run').style.display=stops.length?'block':'none';if(!stops.length)return;
  const start=me||{la:stops[0].la,lo:stops[0].lo},mode=$('end').value,end=mode==='start'?start:mode==='home'?home:null;
  const p=plan(start,stops,end),path=[[start.la,start.lo],...p.order.map(s=>[s.la,s.lo])];if(end)path.push([end.la,end.lo]);
  L.polyline(path,{color:'#4ade80',weight:4,opacity:.8}).addTo(runLayer);
  p.order.forEach((s,i)=>L.marker([s.la,s.lo],{icon:L.divIcon({className:'',html:`<div class="num">${i+1}</div>`,iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:900}).addTo(runLayer).bindPopup(esc(s.t)));
  let prev=start;$('stops').innerHTML=p.order.map(s=>{const leg=dist(prev.la,prev.lo,s.la,s.lo);prev=s;return `<li>${esc(s.t)} <span style="color:var(--mut)">· ${esc(s.h)} · ${leg.toFixed(1)} mi leg</span></li>`}).join('');
  const drive=p.miles*1.3;
  $('sum').textContent=`${p.order.length} stops · about ${drive.toFixed(0)} road miles (${p.miles.toFixed(0)} straight-line)${mode==='home'&&!home?' · home not set yet, tap "Set home = here" when you are there':''}${me?'':' · no GPS yet, starting from the first stop'}${p.order.length>9?' · Google Maps takes 9 stops at a time; the link covers the first 9':''}`;
  const o=p.order.slice(0,9),dest=end||o[o.length-1],way=(end?o:o.slice(0,-1)).map(s=>s.la+','+s.lo).join('|');
  $('gmaps').href=`https://www.google.com/maps/dir/?api=1${me?`&origin=${me.la},${me.lo}`:''}&destination=${dest.la},${dest.lo}${way?'&waypoints='+encodeURIComponent(way):''}&travelmode=driving`;
}
function render(){
  const r=+$('rad').value,min=+$('min').value,src=$('src').value;
  let rows=items.filter(i=>!hidden.has(i.id)&&(run.includes(i.id)||(i.s>=min&&(!src||i.src===src)))).map(i=>({...i,dm:me?dist(me.la,me.lo,i.la,i.lo):null}));
  if(me)rows=rows.filter(i=>i.dm<=r||run.includes(i.id));
  rows.sort((a,b)=>me?a.dm-b.dm:b.s-a.s);
  pins.clearLayers();
  rows.forEach(i=>L.circleMarker([i.la,i.lo],{radius:i.px==='exact'?8:6,color:color(i.s),weight:2,fillOpacity:i.px==='exact'?.85:.35,dashArray:i.px==='exact'?null:'3'}).addTo(pins)
    .bindPopup(`<b>${esc(i.t)}</b><br>${esc(i.h)}<br><a href="${i.u}" target="_blank" rel="noopener">Open listing</a>`));
  if(ring){ring.remove();ring=null}
  if(me&&r<900)ring=L.circle([me.la,me.lo],{radius:r*1609.34,color:'#4ade80',weight:1,fillOpacity:.05}).addTo(map);
  $('list').innerHTML=rows.length?rows.map(i=>{const isNew=!firstRun&&!seen.has(i.id),inRun=run.includes(i.id);
    return `<div class="card s${i.s}${isNew?' new':''}${inRun?' in':''}">${i.dm!=null?`<div class="d">${i.dm.toFixed(1)} mi ${bearing(me.la,me.lo,i.la,i.lo)}</div>`:''}<div class="t">${esc(i.t)}</div>
    <div class="m"><span class="tag">${i.c}</span><span class="tag">${SRC[i.src]||'Craigslist'}</span>${isNew?'<span class="tag" style="color:#4ade80">new</span>':''}${esc(i.h)} · ${i.px==='exact'?'pin exact':'pin approximate'}${i.posted?' · posted '+age(i.posted):''}</div>
    ${i.n?`<div class="n">${esc(i.n)}</div>`:''}
    <div class="acts"><button class="${inRun?'':'add'}" data-run="${i.id}">${inRun?'Remove from run':'Add to run'}</button><a href="https://www.google.com/maps/dir/?api=1&destination=${i.la},${i.lo}" target="_blank" rel="noopener">Navigate</a><a href="${i.u}" target="_blank" rel="noopener">Listing</a><button data-hide="${i.id}">Hide</button></div></div>`}).join('')
    :`<div class="empty">${me?'Nothing in range at this value level. Widen the range or lower the value filter.':'Waiting for GPS. Tap the map to set your position by hand.'}</div>`;
  $('stat').innerHTML=`${rows.length} shown / ${items.length} tracked<br>${me?(meManual?'position set by hand':'GPS live'):'no position yet'} · scan ${scanned?age(scanned):'?'}${statusOk?'':' · <span style="color:#fbbf24">last scan failed</span>'}`;
  if(me&&!meManual)rows.filter(i=>i.s>=4&&i.dm<=Math.min(r,3)&&!announced.has(i.id)).slice(0,2).forEach(i=>{announced.add(i.id);
    try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    if(voice&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(`${i.t}, ${i.dm.toFixed(1)} miles ${bearing(me.la,me.lo,i.la,i.lo)}`))});
  renderRun();
}
function setMe(la,lo,manual){const first=!me;me={la,lo};meManual=manual;
  if(!meMark)meMark=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:1000}).addTo(map);else meMark.setLatLng([la,lo]);
  if(first)map.setView([la,lo],11);else if(follow&&!manual)map.panTo([la,lo]);render()}
async function load(){try{
  const[d,s]=await Promise.all([fetch('listings.json?t='+Date.now()).then(r=>r.json()),fetch('status.json?t='+Date.now()).then(r=>r.json()).catch(()=>({ok:true}))]);
  items=d.items;scanned=d.scanned;statusOk=s.ok!==false;render();
  if(firstRun&&seen.size===0){items.forEach(i=>seen.add(i.id));LS('sr_seen',[...seen])}
}catch(e){$('stat').textContent='Could not load scan data'}}
document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.hide){hidden.add(t.dataset.hide);run=run.filter(x=>x!==t.dataset.hide);LS('sr_hidden',[...hidden]);LS('sr_run',run);render()}
  if(t.dataset.run){run=run.includes(t.dataset.run)?run.filter(x=>x!==t.dataset.run):[...run,t.dataset.run];LS('sr_run',run);render()}});
$('rad').onchange=$('min').onchange=$('src').onchange=$('end').onchange=render;
$('clear').onclick=()=>{run=[];LS('sr_run',run);render()};
$('sethome').onclick=()=>{if(me){home={la:me.la,lo:me.lo};LS('sr_home',home);$('sethome').textContent='Home saved';$('end').value='home';render()}};
$('recenter').onclick=()=>{follow=true;if(me)map.setView([me.la,me.lo],Math.max(map.getZoom(),11))};
$('voice').onclick=()=>{voice=!voice;$('voice').textContent='Voice alerts '+(voice?'on':'off');$('voice').classList.toggle('on',voice);if(voice&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance('Voice alerts on'))};
map.on('click',e=>{if(!me||meManual)setMe(e.latlng.lat,e.latlng.lng,true)});
if(navigator.geolocation)navigator.geolocation.watchPosition(p=>setMe(p.coords.latitude,p.coords.longitude,false),()=>render(),{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
if(navigator.wakeLock){const wl=()=>navigator.wakeLock.request('screen').catch(()=>{});wl();document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&wl())}
load();setInterval(load,180000);
window.addEventListener('pagehide',()=>{items.forEach(i=>seen.add(i.id));LS('sr_seen',[...seen])});
</script></body></html>
