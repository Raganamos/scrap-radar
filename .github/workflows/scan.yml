name: scan
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # the home PC is the main scanner; this only steps in when its data is over 90 minutes old
      - id: fresh
        run: |
          python3 -c "import json,datetime as d;t=d.datetime.fromisoformat(json.load(open('listings.json'))['scanned'].replace('Z','+00:00'));print('stale=' + str((d.datetime.now(d.timezone.utc)-t).total_seconds()>5400).lower())" >> "$GITHUB_OUTPUT"
      - if: steps.fresh.outputs.stale == 'true'
        run: python3 scan.py
      - run: |
          git config user.name "scrap-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add listings.json status.json exact.json
          git diff --cached --quiet || (git commit -m "scan $(date -u +%FT%RZ)" && git push)
